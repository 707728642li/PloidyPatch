name: test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Verify package metadata and generated CLI documentation
        run: |
          python -m pip check
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            python scripts/export_cli_inventory_v0.1.py \
              --output docs/CLI_COMMAND_INVENTORY_v0.1.json --check
            python scripts/export_cli_parameters_v1.py \
              --output docs/CLI_PARAMETERS.md --check
          fi
          python -m compileall -q src scripts
      - name: Run test suite
        run: python scripts/run_public_test_suite_v1.py
      - name: Run checksum-bound tutorial data
        run: |
          python examples/minimal_reviewed_patch/run_example.py \
            --output-dir "$RUNNER_TEMP/minimal-reviewed-patch"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "minimal-reviewed-patch" / "run_summary.json")
              .read_text(encoding="utf-8")
          )
          assert report["accepted_additions"] == 2
          assert report["automatic_approval"] is False
          assert report["byte_identical_reversion"] is True
          PY

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build source and wheel distributions reproducibly
        run: |
          python -m pip install --upgrade pip build twine
          python scripts/build_release_candidate_v0.3.py \
            --project-root . \
            --work-root "$RUNNER_TEMP/ploidypatch-release" \
            --evidence-root "$RUNNER_TEMP/ploidypatch-release-evidence"
      - name: Validate distribution metadata
        run: python -m twine check "$RUNNER_TEMP"/ploidypatch-release/build_a/dist/*
      - name: Verify source distribution research assets
        shell: bash
        run: |
          sdist=$(printf '%s\n' "$RUNNER_TEMP"/ploidypatch-release/build_a/dist/*.tar.gz)
          members="$RUNNER_TEMP/ploidypatch-sdist-members.txt"
          tar -tzf "$sdist" > "$members"
          grep -q '/examples/minimal_reviewed_patch/run_example.py$' "$members"
          grep -q '/docs/PROJECT_CHARTER.md$' "$members"
          grep -q '/docs/USER_GUIDE.md$' "$members"
          grep -q '/docs/REPRODUCIBILITY_GUIDE.md$' "$members"
          grep -q '/docs/CLI_COMMAND_INVENTORY_v0.1.json$' "$members"
          grep -q '/docs/CLI_PARAMETERS.md$' "$members"
          grep -q '/docs/examples/report_preview/index.html$' "$members"
          grep -q '/docs/examples/report_preview/SHA256SUMS$' "$members"
          grep -q '/examples/minimal_reviewed_patch/report_scores.tsv$' "$members"
          grep -q '/examples/minimal_reviewed_patch/report_copy_features.tsv$' "$members"
          grep -q '/examples/minimal_reviewed_patch/report_topology.tsv$' "$members"
          grep -q '/LICENSE$' "$members"
          grep -q '/CITATION.cff$' "$members"
          grep -q '/packaging/conda/meta.yaml$' "$members"
          grep -q '/containers/Dockerfile$' "$members"
          grep -q '/scripts/smoke_container_v0.1.sh$' "$members"
          grep -q '/docs/release_evidence/container_core_v0.1/container_smoke.json$' "$members"
          grep -q '/config/holdouts/coffea_et39_v1.0/contract.json$' "$members"
          grep -q '/scripts/run_coffea_blind_pipeline_v1.0.sh$' "$members"
      - name: Verify independent builds and both installed archives
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads(
              (root / "ploidypatch-release-evidence" / "reproducibility_report.json")
              .read_text(encoding="utf-8")
          )
          manifest = json.loads(
              (root / "ploidypatch-release-evidence" / "release_manifest.json")
              .read_text(encoding="utf-8")
          )
          assert report["wheel_byte_identical"] is True
          assert report["sdist_byte_identical"] is True
          assert report["stable_example_outputs_identical"] is True
          assert report["normalized_example_command_logs_identical"] is True
          assert manifest["installed_smoke"]["wheel"]["pip_check"] == "passed"
          assert manifest["installed_smoke"]["sdist"]["pip_check"] == "passed"
          assert manifest["installed_smoke"]["example_automatic_approval"] is False
          assert manifest["installed_smoke"]["example_byte_identical_reversion"] is True
          assert manifest["installed_smoke"]["wheel"]["example_report_state"] == "validated_reversible_run"
          assert manifest["installed_smoke"]["sdist"]["example_report_state"] == "validated_reversible_run"
          assert manifest["release_boundary"]["distribution_metadata_complete"] is True
          assert manifest["release_boundary"]["archive_doi"] == "10.5281/zenodo.21875561"
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ploidypatch-distributions
          path: |
            ${{ runner.temp }}/ploidypatch-release/build_a/dist/*
            ${{ runner.temp }}/ploidypatch-release-evidence/*
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build digest-pinned non-root core image
        run: |
          docker build \
            --pull \
            --file containers/Dockerfile \
            --tag ploidypatch-core:test \
            .
      - name: Verify image identity, CLI and offline reversible example
        shell: bash
        run: |
          bash scripts/smoke_container_v0.1.sh \
            ploidypatch-core:test \
            examples/minimal_reviewed_patch \
            "$RUNNER_TEMP/container-smoke"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "container-smoke" / "container_smoke.json")
              .read_text(encoding="utf-8")
          )
          assert report["runtime_user"] == "10001:10001"
          assert report["runtime_network"] == "none"
          assert report["runtime_read_only"] is True
          assert all(report["checks"].values())
          PY

  report-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install report quality dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run Python lint and type gates
        run: |
          python -m ruff check src/ploidypatch tests scripts --select E9,F63,F7,F82
          python -m ruff check \
            src/ploidypatch/review_report.py \
            tests/test_review_report.py \
            tests/test_report_public_assets.py \
            tests/test_report_frontend_assets.py \
            --select E4,E7,E9,F --ignore E501
          python -m mypy --ignore-missing-imports --follow-imports=skip \
            src/ploidypatch/review_report.py
      - name: Validate report JavaScript and measured coverage
        run: |
          node --check src/ploidypatch/report_assets/report.js
          python -m pytest -q \
            tests/test_review_report.py \
            tests/test_report_public_assets.py \
            tests/test_report_frontend_assets.py \
            --cov=ploidypatch.review_report \
            --cov-report=term-missing \
            --cov-fail-under=80

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and run the offline reviewed example
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          ploidypatch --version
          python examples/minimal_reviewed_patch/run_example.py \
            --output-dir "$RUNNER_TEMP/minimal-reviewed-patch"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "minimal-reviewed-patch"
          summary = json.loads((output / "run_summary.json").read_text())
          report = json.loads((output / "report" / "report.json").read_text())
          assert summary["byte_identical_reversion"] is True
          assert report["summary"]["state"] == "validated_reversible_run"
          assert report["truth_access"] is False
          PY
