name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          release_tag=$(python -c 'import tomllib; v=tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; print("v" + v)')
          test "${release_tag}" = "${GITHUB_REF_NAME}"
      - name: Build and verify distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip build twine
          python scripts/build_release_candidate_v0.3.py \
            --work-root "$RUNNER_TEMP/ploidypatch-release" \
            --evidence-root "$RUNNER_TEMP/ploidypatch-release-evidence"
          mkdir dist
          cp "$RUNNER_TEMP/ploidypatch-release/build_a/dist/"* dist/
          python -m twine check dist/*
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "PloidyPatch ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ploidypatch-release
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ploidypatch-release-evidence
          path: ${{ runner.temp }}/ploidypatch-release-evidence/*
          if-no-files-found: error

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ploidypatch/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ploidypatch-release
          path: dist
      - name: Keep only Python distributions
        shell: bash
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
