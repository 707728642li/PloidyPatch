    <g transform="translate(20 108)"><rect width="366" height="29" rx="7" fill="#f4f7fa"/><circle cx="16" cy="14.5" r="7" fill="#18a7a0"/><text x="16" y="18" text-anchor="middle" font-size="9" fill="#fff">2</text><text x="34" y="19" class="body">Accepted singleton · PPCONS_gene_c</text><text x="348" y="19" text-anchor="end" class="small muted">#2</text></g>
    <g transform="translate(20 144)"><rect width="366" height="29" rx="7" fill="#f4f7fa"/><circle cx="16" cy="14.5" r="7" fill="#d5972b"/><text x="16" y="18" text-anchor="middle" font-size="9" fill="#fff">3</text><text x="34" y="19" class="body">Rejected alternative · PPCONS_gene_b</text><text x="348" y="19" text-anchor="end" class="small muted">#3</text></g>

    <g transform="translate(430)"><g filter="url(#shadow)"><rect width="406" height="194" rx="14" class="card"/></g><text x="20" y="27" class="caps" fill="#2c78b8">EXACT OVERLAP</text><text x="20" y="53" class="h2">Projection-method intersections</text>
      <g transform="translate(20 78)" class="small"><circle cx="9" cy="8" r="6" fill="#2c78b8"/><circle cx="27" cy="8" r="6" fill="#2c78b8"/><circle cx="45" cy="8" r="6" fill="#2c78b8"/><rect x="66" width="254" height="16" rx="4" class="track"/><rect x="66" width="254" height="16" rx="4" fill="url(#bar)"/><text x="361" y="12" text-anchor="end">1</text></g>
      <g transform="translate(20 113)" class="small"><circle cx="9" cy="8" r="6" fill="#fff" stroke="#a8b6c3" stroke-width="2"/><circle cx="27" cy="8" r="6" fill="#2c78b8"/><circle cx="45" cy="8" r="6" fill="#2c78b8"/><rect x="66" width="254" height="16" rx="4" class="track"/><rect x="66" width="254" height="16" rx="4" fill="url(#bar)"/><text x="361" y="12" text-anchor="end">1</text></g>
      <g transform="translate(20 148)" class="small"><circle cx="9" cy="8" r="6" fill="#2c78b8"/><circle cx="27" cy="8" r="6" fill="#fff" stroke="#a8b6c3" stroke-width="2"/><circle cx="45" cy="8" r="6" fill="#2c78b8"/><rect x="66" width="254" height="16" rx="4" class="track"/><rect x="66" width="254" height="16" rx="4" fill="url(#bar)"/><text x="361" y="12" text-anchor="end">1</text></g>
    </g>

    <g transform="translate(860)"><g filter="url(#shadow)"><rect width="412" height="194" rx="14" class="card"/></g><text x="20" y="27" class="caps" fill="#2c78b8">INTERPRETATION</text><text x="20" y="53" class="h2">Evidence, never automatic approval</text><rect x="20" y="73" width="372" height="42" rx="8" fill="#eef8f4" stroke="#277b62"/><text x="34" y="91" class="small" font-weight="700" fill="#277b62">PASS · Review coverage</text><text x="34" y="107" class="small muted">All candidates have explicit decisions.</text><rect x="20" y="124" width="372" height="50" rx="8" fill="#f4f7fa" stroke="#2c78b8"/><text x="34" y="143" class="small" font-weight="700" fill="#2c78b8">INFO · Decision boundary</text><text x="34" y="160" class="small muted">Scores prioritize inspection; no candidate is auto-approved.</text></g>
  </g>

  <g transform="translate(84 562)" class="ui">
    <g filter="url(#shadow)"><rect width="780" height="214" rx="14" class="card"/></g><text x="20" y="29" class="caps" fill="#2c78b8">REVIEW WORKSPACE</text><text x="20" y="55" class="h2">Candidate explorer</text><rect x="20" y="70" width="740" height="30" rx="7" fill="#edf3f7"/><text x="34" y="90" class="small muted">CANDIDATE</text><text x="270" y="90" class="small muted">LOCUS</text><text x="430" y="90" class="small muted">SUPPORT</text><text x="565" y="90" class="small muted">PRIORITY</text><text x="692" y="90" class="small muted">DECISION</text>
