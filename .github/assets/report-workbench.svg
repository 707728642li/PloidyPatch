<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">PloidyPatch interactive evidence report</title>
  <desc id="desc">A polished interface preview showing decision state, triage metrics, exact method intersections, a candidate table, and shared-axis gene structures.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d2f4e"/><stop offset="0.58" stop-color="#15577d"/><stop offset="1" stop-color="#148f91"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#2c78b8"/><stop offset="1" stop-color="#18a7a0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#123b61" flood-opacity="0.12"/></filter>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#132338}.muted{fill:#607086}.caps{font-size:10px;font-weight:700;letter-spacing:1.6px}.h1{font-size:30px;font-weight:750}.h2{font-size:16px;font-weight:700}.small{font-size:11px}.body{font-size:12px}.value{font-size:26px;font-weight:750}.mono{font-family:Consolas,monospace;font-size:10px}.card{fill:#fff;stroke:#dce4ec}.track{fill:#eaf0f5}.phase0{fill:#277b62}.phase1{fill:#d5972b}.phase2{fill:#7a5ea8}
    </style>
  </defs>
  <rect width="1440" height="820" fill="#f5f8fb"/>
  <rect width="1440" height="164" fill="url(#hero)"/>
  <g transform="translate(84 32)" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="30" height="30" rx="7" fill="none" stroke="#80ddd4" stroke-width="2"/><text x="15" y="21" text-anchor="middle" font-size="15" font-weight="800">PP</text>
    <text x="43" y="20" font-size="11" font-weight="700" letter-spacing="1.5">PLOIDYPATCH EVIDENCE REPORT</text>
    <text x="0" y="74" class="h1" fill="#fff">Minimal reviewed patch</text>
    <text x="0" y="101" font-size="13" fill="#d7edf2">Duplication-aware candidate preservation · human review · reversible annotation patching</text>
    <g transform="translate(0 118)" font-size="10"><rect width="102" height="24" rx="12" fill="none" stroke="#ffffff55"/><text x="51" y="16" text-anchor="middle">REPORT SCHEMA V1</text><rect x="112" width="106" height="24" rx="12" fill="none" stroke="#ffffff55"/><text x="165" y="16" text-anchor="middle">OFFLINE · SEALED</text></g>
  </g>

  <g filter="url(#shadow)" class="ui">
    <g transform="translate(84 142)"><rect width="1272" height="74" rx="13" class="card"/><rect width="5" height="74" rx="3" fill="#277b62"/><text x="24" y="25" class="caps" fill="#2c78b8">CURRENT DECISION STATE</text><text x="24" y="51" class="h2">Review complete and byte-identical reversion verified</text><rect x="1074" y="21" width="174" height="31" rx="16" fill="#e8f4ef"/><text x="1161" y="41" text-anchor="middle" class="caps" fill="#277b62">VALIDATED REVERSIBLE RUN</text></g>
    <g transform="translate(84 232)">
      <g><rect width="300" height="88" rx="13" class="card"/><text x="18" y="25" class="small muted">Candidates</text><text x="18" y="59" class="value">3</text><text x="280" y="59" text-anchor="end" class="small muted">1 conflict set</text></g>
      <g transform="translate(324)"><rect width="300" height="88" rx="13" class="card"/><text x="18" y="25" class="small muted">Reviewed</text><text x="18" y="59" class="value">3</text><text x="280" y="59" text-anchor="end" class="small" fill="#277b62">100.0%</text></g>
      <g transform="translate(648)"><rect width="300" height="88" rx="13" class="card"/><text x="18" y="25" class="small muted">Accepted additions</text><text x="18" y="59" class="value">2</text><text x="280" y="59" text-anchor="end" class="small muted">2 patch events</text></g>
      <g transform="translate(972)"><rect width="300" height="88" rx="13" class="card"/><text x="18" y="25" class="small muted">Topology available</text><text x="18" y="59" class="value">2</text><text x="280" y="59" text-anchor="end" class="small muted">optional evidence</text></g>
    </g>
  </g>

