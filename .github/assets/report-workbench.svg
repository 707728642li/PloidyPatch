    <g transform="translate(20 145)"><line x2="740" stroke="#dce4ec"/><text x="14" y="27" class="body" font-weight="700">PPCONS_gene_c</text><text x="250" y="27" class="body">chr3:301–390 (−)</text><text x="410" y="27" class="small">2 methods</text><text x="545" y="27" class="body">#2 of 3</text><text x="672" y="27" class="small" fill="#277b62" font-weight="700">ACCEPT</text></g>
    <g transform="translate(20 182)"><line x2="740" stroke="#dce4ec"/><text x="14" y="24" class="body" font-weight="700">PPCONS_gene_b</text><text x="250" y="24" class="body">chr2:151–240 (+)</text><text x="410" y="24" class="small">2 methods</text><text x="545" y="24" class="body">#3 of 3</text><text x="672" y="24" class="small" fill="#ba4d55" font-weight="700">REJECT</text></g>

    <g transform="translate(884)"><g filter="url(#shadow)"><rect width="388" height="214" rx="14" class="card"/></g><text x="20" y="29" class="caps" fill="#2c78b8">SHARED-AXIS COMPARISON</text><text x="20" y="55" class="h2">Mutually exclusive CDS chains</text><text x="20" y="80" class="small muted">PPCONS_gene_a · selected</text><line x1="24" x2="360" y1="105" y2="105" stroke="#9bacba" stroke-width="2"/><rect x="24" y="92" width="152" height="26" rx="3" class="phase0"/><path d="M360 105l-12-7v14z" fill="#607086"/><text x="20" y="141" class="small muted">PPCONS_gene_b · alternative</text><line x1="24" x2="360" y1="166" y2="166" stroke="#9bacba" stroke-width="2"/><rect x="176" y="153" width="184" height="26" rx="3" class="phase1"/><path d="M360 166l-12-7v14z" fill="#607086"/><text x="20" y="198" class="small muted">Boundary displacement 100 bp · phase-aware · reviewer decides</text></g>
